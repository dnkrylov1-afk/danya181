<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>База знаний преподавателя — Квантастика</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>

  <style>
    :root {
      --primary: #4A2E9E;
      --primary-soft: #6B4FC4;
      --primary-light: #8F7AD6;
      --primary-pale: #EDE8F8;
      --primary-dark: #2E1B6E;
      --bg: #F7F5FC;
      --white: #FFFFFF;
      --text: #2D2D3A;
      --text-light: #7A7A8E;
      --sidebar-width: 280px;
      --radius: 16px;
      --shadow: 0 4px 24px rgba(74, 46, 158, 0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      min-height: 100vh;
    }

    .login-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(160deg, #D5CCF0, #EDE8F8, #F7F5FC);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.4s ease;
    }
    .login-overlay.hidden { opacity: 0; pointer-events: none; }
    .login-box {
      background: var(--white);
      border-radius: 20px;
      padding: 40px;
      width: 400px;
      box-shadow: 0 12px 48px rgba(74, 46, 158, 0.15);
      text-align: center;
    }
    .login-box h2 {
      font-size: 26px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #2E1B6E, #4A2E9E, #6B4FC4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }
    .login-box p { color: var(--text-light); margin-bottom: 24px; font-size: 14px; }
    .login-input {
      width: 100%;
      padding: 14px 18px;
      border: 1.5px solid #D5CCF0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      margin-bottom: 16px;
      text-align: center;
      letter-spacing: 1px;
      background: var(--bg);
    }
    .login-input:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(74, 46, 158, 0.08); }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #4A2E9E, #6B4FC4);
      color: var(--white);
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .login-btn:hover { opacity: 0.88; }
    .login-error { color: #C46B6B; font-size: 13px; margin-top: 12px; display: none; }

    .sidebar {
      width: var(--sidebar-width);
      background: linear-gradient(180deg, #EDE8F8, #F7F5FC);
      color: var(--text);
      padding: 28px 14px 40px;
      overflow-y: auto;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      z-index: 100;
      border-right: 1px solid #D5CCF0;
    }
    .sidebar-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 4px;
      padding: 0 10px;
      background: linear-gradient(135deg, #2E1B6E, #4A2E9E, #6B4FC4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sidebar-subtitle {
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 18px;
      padding: 0 10px;
    }
    .role-badge {
      display: inline-block;
      background: var(--primary-pale);
      color: var(--primary-dark);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 12px;
      margin: 0 10px 14px;
      font-weight: 600;
    }
    .role-badge.admin { background: var(--primary-light); color: var(--white); font-weight: 700; }
    .logout-btn {
      display: block;
      width: calc(100% - 20px);
      margin: 0 10px 20px;
      padding: 8px;
      background: transparent;
      border: 1px solid var(--primary-light);
      color: var(--primary-dark);
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .logout-btn:hover { background: var(--primary-pale); }

    .menu-section { margin-bottom: 6px; }
    .menu-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--primary-dark);
      cursor: pointer;
      border-radius: 10px;
      user-select: none;
    }
    .menu-section-header:hover { background: var(--primary-pale); }
    .menu-section-header .arrow {
      transition: transform 0.3s ease;
      font-size: 11px;
      color: var(--primary-light);
    }
    .menu-section.open .menu-section-header .arrow { transform: rotate(90deg); }
    .menu-section-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
    }
    .menu-section.open .menu-section-content { max-height: 3000px; }
    .menu-item {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 7px 14px 7px 22px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .menu-item:hover { background: var(--primary-pale); color: var(--primary-dark); }
    .menu-item.active {
      background: var(--primary-light);
      color: var(--white);
      font-weight: 600;
    }
    .menu-item.sub { padding-left: 30px; }

    .home-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      text-align: center;
    }
    .home-hero h1 {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 36px;
      background: linear-gradient(135deg, #2E1B6E, #4A2E9E, #6B4FC4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .home-hero .search-container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 18px 28px;
      border: 1px solid #D5CCF0;
      border-radius: 28px;
      font-size: 16px;
      outline: none;
      background: var(--white);
      text-align: left;
      box-shadow: 0 2px 12px rgba(74, 46, 158, 0.08);
    }
    .search-input:focus { border-color: var(--primary-light); box-shadow: 0 4px 20px rgba(74, 46, 158, 0.15); }
    .search-suggestions {
      list-style: none;
      background: var(--white);
      border: 1px solid #D5CCF0;
      border-radius: 16px;
      margin-top: 8px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(74, 46, 158, 0.15);
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 200;
      max-height: 300px;
      overflow-y: auto;
    }
    .search-suggestions li {
      padding: 12px 24px;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 1px solid var(--primary-pale);
    }
    .search-suggestions li:hover { background: var(--primary-pale); }

    .main {
      margin-left: var(--sidebar-width);
      flex: 1;
      padding: 48px 48px 80px;
      max-width: 1200px;
    }
    .content-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 28px 32px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    .content-card h3 { color: var(--primary-dark); margin-bottom: 12px; font-size: 19px; }
    .content-card h4 { color: var(--primary-dark); margin: 16px 0 8px; font-size: 16px; }
    .content-card p, .content-card li { font-size: 14.5px; margin-bottom: 8px; }
    .content-card ul, .content-card ol { padding-left: 22px; margin-bottom: 12px; }
    .btn {
      display: inline-block;
      background: var(--primary-pale);
      color: var(--primary-dark);
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
    }
    .btn:hover { background: var(--primary-light); color: var(--white); }
    .template-box {
      background: var(--primary-pale);
      border-left: 4px solid var(--primary);
      padding: 16px 20px;
      border-radius: 10px;
      margin: 10px 0;
      white-space: pre-wrap;
      font-size: 14px;
    }
    .constructor-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .constructor-row select {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid #D5CCF0;
      font-size: 13.5px;
      min-width: 200px;
      background: var(--white);
    }
    .copy-btn {
      background: var(--primary);
      color: var(--white);
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12.5px;
      margin-top: 8px;
    }

    .edit-mode .content-card {
      outline: 2px dashed var(--primary-light);
      outline-offset: -2px;
      cursor: text;
      min-height: 50px;
    }
    .edit-toolbar {
      display: none;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: center;
    }
    .edit-toolbar.visible { display: flex; }
    .edit-toolbar button {
      background: var(--primary-pale);
      color: var(--primary-dark);
      border: none;
      padding: 8px 18px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .save-btn {
      background: #7DB87A;
      color: var(--white);
      border: none;
      padding: 8px 18px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .edit-status { font-size: 12.5px; color: var(--text-light); }

    .menu-section[hidden], .hidden { display: none !important; }
    .login-input { letter-spacing: normal; }
    #mobile-menu-btn { display: none; }
    .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; }
    .field input, .field select, .users-table input, .users-table select {
      padding: 9px 10px; border: 1px solid #D5CCF0; border-radius: 9px; min-width: 0; width: 100%;
      font: inherit; background: white;
    }
    .employee-form { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; margin-top: 14px; }
    .employee-actions { grid-column: 1/-1; display:flex; gap:8px; flex-wrap:wrap; }
    .primary-btn { background: var(--primary); color:white; }
    .form-message,.row-status { font-size:13px; color:var(--primary-dark); }
    .credential-panel { padding:16px; border-radius:12px; background:#F0EAFD; margin-top:12px; }
    .credential-panel pre { padding:10px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
    .users-table-wrap { overflow-x:auto; max-width:100%; }
    .users-table { border-collapse:collapse; width:100%; min-width:760px; font-size:12px; }
    .users-table th,.users-table td { border-bottom:1px solid #EDE8F8; text-align:left; padding:9px 5px; }
    .users-table th { color:var(--primary-dark); }
    .row-actions { display:flex; flex-wrap:wrap; align-items:center; gap:5px; min-width:130px; }
    .row-actions .btn { padding:5px 8px; font-size:11px; }
    .row-status { flex-basis:100%; }
    @media (max-width: 900px) {
      .sidebar { display: none; width:min(85vw,320px); }
      body.menu-open .sidebar { display:block; z-index:900; box-shadow:5px 0 30px rgba(0,0,0,.2); }
      #mobile-menu-btn { display:block; position:fixed; top:7px; right:8px; z-index:901; border:1px solid #D5CCF0; border-radius:8px; padding:7px 10px; background:white; color:var(--primary-dark); }
      .main { margin-left: 0; padding: 55px 20px 60px; }
      .home-hero h1 { font-size: 26px; }
      .login-box { width:min(400px,92vw);padding:24px; }
      .employee-form { grid-template-columns:1fr; }
    }
  </style>
</head>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDgtXnDHiq5HACZBgsudodKoa6RzH40eII",
      authDomain: "kvantastika-knowledge-base.firebaseapp.com",
      databaseURL: "https://kvantastika-knowledge-base-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "kvantastika-knowledge-base",

      messagingSenderId: "587274017457",
      appId: "1:587274017457:web:ba38be16c245c4c8686090"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    (function() {
      const SIDEBAR = document.getElementById('sidebar');
      const ROOT = document.getElementById('page-root');
      const LOGIN_OVERLAY = document.getElementById('login-overlay');
      const LOGIN_INPUT = document.getElementById('login-input');
      const LOGIN_BTN = document.getElementById('login-btn');
      const LOGIN_ERROR = document.getElementById('login-error');
      const ROLE_BADGE = document.getElementById('role-badge');
      const LOGOUT_BTN = document.getElementById('logout-btn');
      const EDIT_TOOLBAR = document.getElementById('edit-toolbar');
      const TOGGLE_EDIT = document.getElementById('toggle-edit');
      const SAVE_CHANGES = document.getElementById('save-changes');
      const EDIT_STATUS = document.getElementById('edit-status');

      // Internal Firebase Auth email aliases let teachers log in with a username.
      // Contact email is stored separately in protected /users/$uid.
      const AUTH = firebase.auth();
      const FUNCTIONS = firebase.app().functions('europe-west1');
      const LOGIN_DOMAIN = 'kvantastika-knowledge-base.firebaseapp.com';
      const LOGIN_FORM = document.getElementById('login-form');
      const LOGIN_PASSWORD = document.getElementById('login-password');
      const ADMIN_MENU = document.getElementById('admin-menu');
      const ROLES = {admin:'Администратор',manager:'Руководитель',senior:'Старший преподаватель',teacher:'Преподаватель'};
      let currentRole = null;
      let currentUser = null;
      let isEditMode = false;
      let currentPageId = 'home';
      let sessionVersion = 0;
      let profileWatch = null;
      let profileWatchCallback = null;
      let deniedMessage = '';
      function stopProfileWatch() {
        if(profileWatch && profileWatchCallback) profileWatch.off('value',profileWatchCallback);
        profileWatch = null;profileWatchCallback = null;
      }

      function updateToolbar() {
        EDIT_TOOLBAR.classList.toggle('visible', currentRole==='admin' && currentPageId!=='admin-users');
      }
      function updateRoleBadge() {
        ROLE_BADGE.textContent = ROLES[currentRole] || 'Сотрудник';
        ROLE_BADGE.className = 'role-badge' + (currentRole==='admin'?' admin':'');
        ADMIN_MENU.hidden = currentRole !== 'admin';
      }
      function showLogin(message='') {
        stopProfileWatch();
        currentRole=null;currentUser=null;isEditMode=false;currentPageId='home';
        disableEditMode();ROOT.replaceChildren();
        ADMIN_MENU.hidden=true;EDIT_TOOLBAR.classList.remove('visible');
        document.body.classList.remove('menu-open');
        LOGIN_OVERLAY.classList.remove('hidden');
        LOGIN_ERROR.textContent=message;
        LOGIN_ERROR.style.display=message?'block':'none';
      }

      document.querySelectorAll('.menu-section-header').forEach(header => {
        header.addEventListener('click', () => {
          header.parentElement.classList.toggle('open');
        });
      });

      const generalPages = {
        'home': { title: '', html: `<div class="home-hero"><h1>База знаний школы программирования Квантастика</h1><div class="search-container"><input type="text" id="global-search" class="search-input" placeholder="Поиск по базе знаний"><ul class="search-suggestions hidden" id="suggestions"></ul></div></div>` },
        'templates': { title: 'Шаблонные сообщения', html: `<div class="content-card"><h3>Конструктор шаблонных сообщений</h3><div class="constructor-row"><select id="course-select"><option value="">— Курс —</option><option>Junior</option><option>Middle</option><option>High</option><option>Нейросети</option><option>Графический дизайн</option></select><select id="module-select" disabled><option value="">— Модуль —</option></select><select id="lesson-select" disabled><option value="">— Урок —</option></select></div><div id="template-output" class="template-box">Выберите курс, модуль и урок</div><button id="copy-template" class="copy-btn">Скопировать текст</button></div>` },
      };

      const pages = {...generalPages};
      async function loadFromFirebase() {
        // No requests for content are made before a verified, active user signs in.
        const [snapshot,titlesSnapshot,templatesSnapshot] = await Promise.all([
          db.ref('pages').once('value'),db.ref('pageTitles').once('value'),db.ref('templates').once('value')
        ]);
        const data=snapshot.val()||{};
        const titles=titlesSnapshot.val()||{};
        window.templateData=templatesSnapshot.val()||{};
        for (const [key,value] of Object.entries(data)) {
          const html=typeof value==='string'?value:value?.html;
          if(typeof html!=='string') continue;
          pages[key]={title:titles[key]||value?.title||key,html};
        }
      }

async function saveToFirebase() {
  try {
    if(currentRole!=='admin' || !currentUser) throw Error('Нет прав на изменение страницы');
    const card = document.querySelector('.content-card[data-editable="true"]');
    if (!card) {
      EDIT_STATUS.textContent = 'Нет редактируемого контента';
      setTimeout(() => { EDIT_STATUS.textContent = ''; }, 2000);
      return;
    }
    
    // Временно убираем contenteditable
    card.removeAttribute('contenteditable');
    
    // Сохраняем полный HTML с классом и data-editable
    const fullHTML = card.outerHTML;
    
    // Возвращаем contenteditable, если режим редактирования активен
    if (isEditMode) {
      card.setAttribute('contenteditable', 'true');
    }
    
    await db.ref('pages/' + currentPageId).set(fullHTML);
    
    EDIT_STATUS.textContent = 'Сохранено!';
    setTimeout(() => { EDIT_STATUS.textContent = ''; }, 2000);
  } catch (error) {
    console.error('Ошибка сохранения:', error.message);
    EDIT_STATUS.textContent = 'Ошибка: ' + error.message;
    setTimeout(() => { EDIT_STATUS.textContent = ''; }, 3000);
  }
}

      function showPage(pageId) {
        if(!currentUser) return;
        if(pageId==='admin-users' && currentRole!=='admin') return;
        currentPageId = pageId;
        if(pageId==='admin-users') {
          isEditMode=false;disableEditMode();TOGGLE_EDIT.textContent='Редактировать';
          updateToolbar();
          document.querySelectorAll('.menu-item').forEach(m=>m.classList.remove('active'));
          document.querySelector('[data-page="admin-users"]').classList.add('active');
          window.KBAdmin.render(ROOT,{db,functions:FUNCTIONS,uid:currentUser.uid});
          return;
        }
        const page = pages[pageId];
        if (!page) return;
        ROOT.innerHTML = page.html;
        updateToolbar();
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        const activeBtn = document.querySelector(`.menu-item[data-page="${pageId}"]`);
        if (activeBtn) activeBtn.classList.add('active');
        if (pageId === 'templates') bindTemplateConstructor();
        if (isEditMode) enableEditMode();
        bindSearchInput();
      }

      function bindSearchInput() {
        const searchInput = document.getElementById('global-search');
        const suggestions = document.getElementById('suggestions');
        if (!searchInput || !suggestions) return;
        searchInput.addEventListener('input', () => {
          const query = searchInput.value.toLowerCase().trim();
          if (!query) { suggestions.classList.add('hidden'); return; }
          const results = [];
          for (const [id, page] of Object.entries(pages)) {
            if (page.title && page.title.toLowerCase().includes(query) || page.html && page.html.toLowerCase().includes(query)) {
              results.push({ id, title: page.title || 'Главная' });
            }
          }
          if (results.length) {
            suggestions.innerHTML = '';
            results.slice(0, 8).forEach(r => {
              const li = document.createElement('li');
              li.textContent = r.title;
              li.addEventListener('click', () => {
                showPage(r.id);
                suggestions.classList.add('hidden');
                searchInput.value = '';
              });
              suggestions.appendChild(li);
            });
            suggestions.classList.remove('hidden');
          } else {
            suggestions.classList.add('hidden');
          }
        });
      }

      function bindTemplateConstructor() {
        const courseSelect = document.getElementById('course-select');
        const moduleSelect = document.getElementById('module-select');
        const lessonSelect = document.getElementById('lesson-select');
        const templateOutput = document.getElementById('template-output');
        const copyTemplateBtn = document.getElementById('copy-template');
        if (!courseSelect || !moduleSelect || !lessonSelect) return;

        courseSelect.addEventListener('change', () => {
          const course = courseSelect.value;
          moduleSelect.innerHTML = '<option value="">— Модуль —</option>';
          lessonSelect.innerHTML = '<option value="">— Урок —</option>';
          lessonSelect.disabled = true;
          moduleSelect.disabled = !course;
          if (course && window.templateData && window.templateData[course]) {
            Object.keys(window.templateData[course]).forEach(m => {
              const opt = document.createElement('option');
              opt.value = m; opt.textContent = m;
              moduleSelect.appendChild(opt);
            });
          }
        });

        moduleSelect.addEventListener('change', () => {
          const course = courseSelect.value;
          const module = moduleSelect.value;
          lessonSelect.innerHTML = '<option value="">— Урок —</option>';
          lessonSelect.disabled = !module;
          if (course && module && window.templateData && window.templateData[course][module]) {
            Object.keys(window.templateData[course][module]).forEach(l => {
              const opt = document.createElement('option');
              opt.value = l; opt.textContent = l;
              lessonSelect.appendChild(opt);
            });
          }
        });

        lessonSelect.addEventListener('change', () => {
          const course = courseSelect.value;
          const module = moduleSelect.value;
          const lesson = lessonSelect.value;
          templateOutput.textContent = (course && module && lesson && window.templateData && window.templateData[course][module][lesson])
            ? window.templateData[course][module][lesson] : 'Выберите курс, модуль и урок';
        });

        copyTemplateBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(templateOutput.textContent).then(() => {
            copyTemplateBtn.textContent = 'Скопировано';
            setTimeout(() => { copyTemplateBtn.textContent = 'Скопировать'; }, 1500);
          });
        });
      }

      function enableEditMode() {
        document.body.classList.add('edit-mode');
        document.querySelectorAll('.content-card[data-editable="true"]').forEach(card => {
          card.setAttribute('contenteditable', 'true');
        });
      }

      function disableEditMode() {
        document.body.classList.remove('edit-mode');
        document.querySelectorAll('.content-card').forEach(card => {
          card.removeAttribute('contenteditable');
        });
      }

      SAVE_CHANGES.addEventListener('click', saveToFirebase);
      TOGGLE_EDIT.addEventListener('click', () => {
        if (isEditMode) {
          disableEditMode();
          isEditMode = false;
          TOGGLE_EDIT.textContent = 'Редактировать';
        } else {
          enableEditMode();
          isEditMode = true;
          TOGGLE_EDIT.textContent = 'Просмотр';
        }
      });

      LOGIN_FORM.addEventListener('submit',async (event)=>{
        event.preventDefault();
        const login=LOGIN_INPUT.value.trim().toLowerCase();
        if(!/^[a-z][a-z0-9_-]{2,31}$/.test(login)){
          LOGIN_ERROR.textContent='Введите корректный логин';LOGIN_ERROR.style.display='block';return;
        }
        LOGIN_BTN.disabled=true;LOGIN_BTN.textContent='Вход…';
        LOGIN_ERROR.style.display='none';
        try {await AUTH.signInWithEmailAndPassword(`${login}@${LOGIN_DOMAIN}`,LOGIN_PASSWORD.value);LOGIN_PASSWORD.value='';}
        catch(e){LOGIN_ERROR.textContent='Не удалось войти. Проверьте логин и пароль или обратитесь к администратору.';LOGIN_ERROR.style.display='block';}
        finally {LOGIN_BTN.disabled=false;LOGIN_BTN.textContent='Войти';}
      });
      LOGOUT_BTN.addEventListener('click',async ()=>{await AUTH.signOut();LOGIN_INPUT.value='';LOGIN_PASSWORD.value='';});
      SIDEBAR.addEventListener('click',(e)=>{
        const btn=e.target.closest('.menu-item');
        if(btn) {showPage(btn.dataset.page);document.body.classList.remove('menu-open')}
      });
      document.getElementById('mobile-menu-btn').addEventListener('click',()=>document.body.classList.toggle('menu-open'));
      AUTH.onAuthStateChanged(async user=>{
        const version=++sessionVersion;
        if(!user){showLogin(deniedMessage);deniedMessage='';return;}
        try{
          // Force refresh so freshly assigned roles are visible after login.
          const token=await user.getIdTokenResult(true);
          const snap=await db.ref(`users/${user.uid}`).once('value');
          const profile=snap.val();
          if(!profile?.active || profile.role!==token.claims.role || !ROLES[profile.role]){
            throw Error('Пользователь не активирован администратором');
          }
          if(version!==sessionVersion) return;
          currentRole=profile.role;currentUser=user;
          await loadFromFirebase();
          if(version!==sessionVersion)return;
          LOGIN_OVERLAY.classList.add('hidden');LOGIN_ERROR.style.display='none';
          updateRoleBadge();showPage('home');
          stopProfileWatch();
          profileWatch=db.ref(`users/${user.uid}`);
          profileWatchCallback=snap=>{
            const latest=snap.val();
            if(currentUser?.uid===user.uid && (!latest?.active || latest.role!==currentRole)) {
              deniedMessage='Доступ к аккаунту изменён администратором. Войдите повторно.';
              AUTH.signOut();
            }
          };
          profileWatch.on('value',profileWatchCallback,()=>{deniedMessage='Ошибка проверки доступа';AUTH.signOut()});
        }catch(e){
          console.warn('Авторизация не завершена:',e.code||e.message);
          if(version===sessionVersion){deniedMessage='Нет доступа к базе знаний. Обратитесь к администратору.';await AUTH.signOut();}
        }
      });

    })();
  </script>
</body>
</html>
